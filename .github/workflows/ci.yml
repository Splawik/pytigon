name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy>=1.0" "ruff>=0.5"

      # Gating: syntax errors, undefined names and unused imports.
      - name: Ruff (gating)
        run: ruff check . --select E9,F63,F7,F82,F401

      # Informational: the full rule set still has open findings. Narrow the
      # gating step above as they are fixed, then drop this one.
      - name: Ruff (full report)
        continue-on-error: true
        run: ruff check .

      # Informational: reports the typing debt. Hundreds of findings
      # today, so this deliberately does not gate. It stays in CI so the
      # number is visible and cannot grow silently.
      - name: Mypy (non-gating report)
        continue-on-error: true
        run: mypy pytigon || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install into the same interpreter the tests run with. Using the `ptig`
      # wrapper here would resolve packages from a separate ptig environment
      # that never receives the dependencies installed above.
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q \
            --cov=pytigon \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=32

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
